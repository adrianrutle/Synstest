<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Synstest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 32C12 18 22 12 32 12s20 6 28 20c-8 14-18 20-28 20S12 46 4 32z' fill='%23fff' stroke='%230b3d5c' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%230b7a8c'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23071f2e'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #0d2230; --muted: #5d6f7a; --line: #dfe6ea; --bg: #f5f8f9; --card: #fff;
    --accent: #0b7a8c; --accent-ink: #fff; --warn: #b4531d; --ok: #1f7a43; --bad: #c0392b;
    --r: 16px;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { overscroll-behavior: none; }
  #main { min-height: 100%; display: flex; flex-direction: column;
    padding: calc(var(--safe-t) + 16px) 18px calc(var(--safe-b) + 18px); max-width: 560px; margin: 0 auto; }
  h1 { font-size: 30px; line-height: 1.15; margin: 8px 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 23px; line-height: 1.2; margin: 6px 0 10px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .grow { flex: 1; }
  .center { text-align: center; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 16px 18px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); margin-top: 10px; cursor: pointer; }
  .btn:active { transform: scale(.985); }
  .btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--line); }
  .btn.light { background: #e8f3f5; color: var(--accent); }
  .btn[disabled] { opacity: .45; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 10px 0; }
  .person { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: #e3f1f3; color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 19px; flex: none; }
  input[type=text], input[type=number] { width: 100%; font: inherit; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  .steps { display: flex; gap: 5px; margin: 0 0 14px; }
  .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .steps i.on { background: var(--accent); }
  .eye-tag { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--accent); background: #e3f1f3; padding: 4px 10px; border-radius: 99px; }
  .hero { display: grid; place-items: center; margin: 18px 0 8px; }
  .dist { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .pill { display: inline-block; padding: 6px 12px; border-radius: 99px; font-size: 14px; font-weight: 600; background: #eef2f4; color: var(--muted); }
  .pill.ok { background: #e3f4ea; color: var(--ok); } .pill.warn { background: #fbeee6; color: var(--warn); }
  /* Fullskjerm-testflater */
  .stage { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; z-index: 5;
    padding: calc(var(--safe-t) + 10px) 14px calc(var(--safe-b) + 12px); }
  .stage .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stage .mid { flex: 1; display: grid; place-items: center; position: relative; }
  .stage .hint { text-align: center; font-size: 16px; color: var(--muted); min-height: 2.9em; margin: 6px 0; }
  .flash { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.92); font-size: 26px; font-weight: 700; color: var(--ok); }
  .letters { display: flex; justify-content: center; align-items: center; }
  .letters svg { display: block; cursor: pointer; }
  .letters .wrong { opacity: .18; }
  .xmark { position: absolute; color: var(--bad); font-weight: 800; }
  #cam { position: fixed; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; left: 0; top: 0; }
  #cam.preview { width: 132px; height: auto; opacity: 1; top: calc(var(--safe-t) + 12px); right: 12px; left: auto; border-radius: 12px; transform: scaleX(-1); z-index: 20; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  .rx { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .rx th, .rx td { padding: 9px 4px; text-align: center; border-bottom: 1px solid var(--line); }
  .rx th { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .rx td:first-child, .rx th:first-child { text-align: left; font-weight: 700; }
  .rx td { font-size: 18px; font-weight: 600; }
  .stamp { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .cardshape { border: 2.5px solid var(--accent); border-radius: 3.2mm; background: repeating-linear-gradient(135deg,#f3fafb 0 8px,#e7f3f5 8px 16px); margin: 0 auto; position: relative; }
  .cardshape::after { content: "Legg kortet her"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); font-weight: 600; font-size: 14px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.9s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .link { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; padding: 8px 0; cursor: pointer; }
  ul.clean { padding-left: 20px; margin: 6px 0 12px; } ul.clean li { margin: 4px 0; }
  .tag-est { font-size: 12px; color: var(--warn); font-weight: 600; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<div id="main"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
